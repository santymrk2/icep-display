<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartelería</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #000 !important; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000 !important; overflow: hidden; cursor: none; }
  body { font-family: Arial, Helvetica, sans-serif; color: #fff; background: #000 !important; }
  #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage { -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  /* Wrapper negro que ocupa todo el stage; el media se centra dentro con flexbox */
  .media-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
                display: -webkit-box; display: -webkit-flex; display: flex;
                -webkit-box-align: center; -webkit-align-items: center; align-items: center;
                -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; }
  /* Modo contain (por defecto): el media nunca desborda y mantiene su aspecto */
  .media-wrap .media { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
                       border: none; outline: none; background: #000; }
  /* Modo cover: el media llena el contenedor sin barras negras */
  .media-wrap.cover .media { width: 100%; height: 100%; -o-object-fit: cover; object-fit: cover; }
  .media-wrap.fade { opacity: 0; -webkit-transition: opacity 0.8s ease; transition: opacity 0.8s ease; }
  .media-wrap.fade.in { opacity: 1; }
  .bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000 center center no-repeat; background-size: cover; }
  #msg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; text-align: center; display: none; }
  #msg .inner { position: absolute; top: 50%; left: 0; width: 100%; margin-top: -14vw; }
  #msg .small { font-size: 3vw; color: #a1a1aa; }
  #msg .code { font-family: Arial, Helvetica, "Liberation Sans", "DejaVu Sans", sans-serif; font-variant-numeric: tabular-nums; font-size: 18vw; font-weight: bold; letter-spacing: 0.15em; line-height: 1.1; }
  #status { position: absolute; right: 1vw; bottom: 1vw; width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #ef4444; display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg"><div class="inner"><div class="small" id="msg-top"></div><div class="code" id="msg-code"></div><div class="small" id="msg-bottom"></div></div></div>
<div id="status" title="Sin conexión con el servidor"></div>
<script>
/* Reproductor compatible con navegadores de TV antiguos: ES5, sin frameworks. */
(function () {
  'use strict';

  var TOKEN_KEY = 'carteleria.token';
  var stage = document.getElementById('stage');
  var msgBox = document.getElementById('msg');
  var statusDot = document.getElementById('status');

  /* ---------- Almacenamiento del token (localStorage, con cookie de respaldo) ---------- */
  function readToken() {
    try { var t = window.localStorage.getItem(TOKEN_KEY); if (t) return t; } catch (e) {}
    var m = document.cookie.match(/(?:^|; )carteleria_token=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function writeToken(token) {
    try {
      if (token) window.localStorage.setItem(TOKEN_KEY, token); else window.localStorage.removeItem(TOKEN_KEY);
    } catch (e) {}
    document.cookie = 'carteleria_token=' + (token ? encodeURIComponent(token) : '') +
      '; path=/; max-age=' + (token ? 315360000 : 0);
  }

  /* ---------- Última lista de reproducción (para arrancar sin red) ---------- */
  var PLAY_KEY = 'carteleria.lastplay';
  function saveLastPlay(msg) {
    try { window.localStorage.setItem(PLAY_KEY, JSON.stringify(msg)); } catch (e) {}
  }
  function loadLastPlay() {
    try {
      var t = window.localStorage.getItem(PLAY_KEY);
      var v = t ? JSON.parse(t) : null;
      if (v && v.length !== undefined) v = { items: v }; // formato viejo: solo la lista
      return v;
    } catch (e) { return null; }
  }
  function clearLastPlay() {
    try { window.localStorage.removeItem(PLAY_KEY); } catch (e) {}
  }

  /* ---------- Mensajes en pantalla ---------- */
  function showMessage(top, code, bottom) {
    document.getElementById('msg-top').textContent = top || '';
    document.getElementById('msg-code').textContent = code || '';
    document.getElementById('msg-bottom').textContent = bottom || '';
    msgBox.style.display = 'block';
  }
  function hideMessage() { msgBox.style.display = 'none'; }

  /* ---------- Giro y tamaño de pantalla ---------- */
  var rotation = 0;
  var dissolve = false;
  var lastReport = '';

  function applyLayout() {
    var W = window.innerWidth || document.documentElement.clientWidth;
    var H = window.innerHeight || document.documentElement.clientHeight;
    var st = stage.style;
    var t = '';
    var w = W, h = H;
    if (rotation === 180) { t = 'rotate(180deg) translate(' + (-W) + 'px,' + (-H) + 'px)'; }
    else if (rotation === 90) { w = H; h = W; t = 'translate(' + W + 'px,0) rotate(90deg)'; }
    else if (rotation === 270) { w = H; h = W; t = 'translate(0,' + H + 'px) rotate(-90deg)'; }
    st.width = w + 'px'; st.height = h + 'px';
    st.webkitTransform = t; st.transform = t;
  }

  /* Informa la resolución (en píxeles CSS) para que el panel sepa si es horizontal o vertical. */
  function screenSize() {
    return { width: window.innerWidth || document.documentElement.clientWidth, height: window.innerHeight || document.documentElement.clientHeight };
  }
  function reportScreen() {
    var s = screenSize();
    var key = s.width + 'x' + s.height;
    if (key === lastReport) return;
    lastReport = key;
    if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify({ type: 'screen', width: s.width, height: s.height })); } catch (e) {} }
  }
  window.addEventListener('resize', function () { applyLayout(); reportScreen(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { applyLayout(); reportScreen(); }, 300); });
  applyLayout();

  /* ---------- Reproducción ---------- */
  var playlist = [];
  var index = 0;
  var generation = 0;      // se incrementa en cada cambio de contenido para invalidar timers viejos
  var currentTimer = null;
  var currentEl = null;

  function clearStage() {
    if (currentTimer) { clearTimeout(currentTimer); currentTimer = null; }
    while (stage.firstChild) {
      var el = stage.firstChild;
      // el puede ser un .media-wrap (div) o un elemento legacy; buscar el video dentro si existe.
      var vid = el.tagName === 'VIDEO' ? el : el.querySelector ? el.querySelector('video') : null;
      if (vid) { try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch (e) {} }
      stage.removeChild(el);
    }
    currentEl = null;
  }

  function samePlaylist(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (a[i].id !== b[i].id || a[i].url !== b[i].url || a[i].durationSeconds !== b[i].durationSeconds || a[i].fit !== b[i].fit || a[i].transition !== b[i].transition || a[i].rotation !== b[i].rotation || a[i].flipH !== b[i].flipH || a[i].flipV !== b[i].flipV) return false;
    }
    return true;
  }

  var background = null;
  function showBackground() {
    clearStage();
    if (!background) return;
    var d = document.createElement('div');
    d.className = 'bg';
    d.style.backgroundImage = 'url("' + background + '")';
    stage.appendChild(d);
    currentEl = d;
  }

  /* msg: { items, rotation, transition, background } */
  function setPlaylist(msg) {
    var items = msg.items || [];
    var nextRotation = msg.rotation || 0;
    var nextBg = msg.background || null;
    var layoutChanged = nextRotation !== rotation;
    rotation = nextRotation;
    dissolve = msg.transition === 'dissolve';
    if (layoutChanged) applyLayout();
    var bgChanged = nextBg !== background;
    background = nextBg;
    if (samePlaylist(items, playlist) && currentEl && !(bgChanged && !items.length)) return; // sin cambios: no reiniciar
    generation++;
    playlist = items;
    index = 0;
    clearStage();
    if (!items.length) { hideMessage(); showBackground(); return; }
    hideMessage();
    playCurrent();
  }

  function advance(gen) {
    if (gen !== generation) return;
    index = (index + 1) % playlist.length;
    playCurrent();
  }

  function preload(item) {
    if (item && item.kind === 'image') { var img = new Image(); img.src = item.url; }
  }

  function playCurrent() {
    var gen = generation;
    var item = playlist[index];
    var single = playlist.length === 1;
    var el, wrap;

    // Wrapper negro que centra el contenido y evita bordes blancos en TVs que no soportan object-fit.
    wrap = document.createElement('div');
    wrap.className = 'media-wrap' + (item.fit === 'cover' ? ' cover' : '');

    if (item.kind === 'image') {
      el = document.createElement('img');
      el.className = 'media';
      el.onerror = function () { currentTimer = setTimeout(function () { advance(gen); }, 2000); };
      el.src = item.url;
    } else {
      el = document.createElement('video');
      el.className = 'media';
      el.muted = true;
      el.defaultMuted = true;
      el.setAttribute('muted', '');
      el.setAttribute('playsinline', '');
      el.setAttribute('webkit-playsinline', '');
      el.autoplay = true;
      el.loop = single;
      el.onended = function () { advance(gen); };
      el.onerror = function () { currentTimer = setTimeout(function () { advance(gen); }, 2000); };
      el.src = item.url;
      var p = null;
      try { p = el.play(); } catch (e) {}
      if (p && p.catch) p.catch(function () {});
      watchStall(el, gen);
    }

    wrap.appendChild(el);

    // Reemplazo sin parpadeo: se agrega el nuevo elemento y luego se quita el anterior.
    var old = currentEl;
    var tr = item.transition || (dissolve ? 'dissolve' : 'cut');
    var fade = tr === 'dissolve' && old && playlist.length > 1;
    // Giro y espejo del elemento (en 90/270 se escala para que siga entrando en pantalla).
    var rot = item.rotation || 0, fx = item.flipH ? -1 : 1, fy = item.flipV ? -1 : 1;
    if (rot || fx < 0 || fy < 0) {
      var sw = stage.offsetWidth || 1, sh = stage.offsetHeight || 1;
      var sc = (rot === 90 || rot === 270) ? Math.min(sw / sh, sh / sw) : 1;
      var tf = 'rotate(' + rot + 'deg) scale(' + (fx * sc) + ',' + (fy * sc) + ')';
      wrap.style.webkitTransform = tf; wrap.style.transform = tf;
    }
    if (fade) wrap.className += ' fade';
    stage.appendChild(wrap);
    currentEl = wrap;
    function dropOld() {
      if (old && old.parentNode === stage) {
        var oldVideo = old.querySelector('video');
        if (oldVideo) { try { oldVideo.pause(); oldVideo.removeAttribute('src'); oldVideo.load(); } catch (e) {} }
        stage.removeChild(old);
      }
    }
    if (fade) {
      // Disuelve: el nuevo aparece encima del anterior; el anterior se quita al terminar.
      setTimeout(function () { wrap.className += ' in'; }, 30);
      setTimeout(dropOld, 900);
    } else {
      dropOld();
    }

    if (item.kind === 'image') {
      if (!single) currentTimer = setTimeout(function () { advance(gen); }, (item.durationSeconds || 10) * 1000);
    } else if (item.durationSeconds && !single) {
      currentTimer = setTimeout(function () { advance(gen); }, item.durationSeconds * 1000);
    }
    if (!single) preload(playlist[(index + 1) % playlist.length]);
  }

  // Si un video se queda trabado (sin avanzar) por más de 20 s, se salta al siguiente o se reintenta.
  // currentWrap es el .media-wrap que contiene el video (currentEl al momento de llamar a watchStall).
  function watchStall(video, gen) {
    var last = -1, stuck = 0;
    var iv = setInterval(function () {
      if (gen !== generation) { clearInterval(iv); return; }
      if (video.paused && video.readyState >= 2) { try { video.play(); } catch (e) {} }
      if (video.currentTime === last) stuck++; else { stuck = 0; last = video.currentTime; }
      if (stuck >= 4) {
        clearInterval(iv);
        if (playlist.length > 1) advance(gen); else { try { video.load(); video.play(); } catch (e) {} watchStall(video, gen); }
      }
    }, 5000);
  }

  /* ---------- WebSocket ---------- */
  var ws = null;
  var retryMs = 1000;

  function wsUrl() {
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  }

  function onMessage(ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'pairing') {
      generation++; playlist = []; clearStage(); rotation = 0; applyLayout();
      showMessage('Código de vinculación', msg.code, 'Ingresalo en el panel, en Pantallas');
    } else if (msg.type === 'paired') {
      writeToken(msg.token);
    } else if (msg.type === 'unpaired') {
      writeToken(null);
      clearLastPlay();
    } else if (msg.type === 'play') {
      saveLastPlay(msg);
      setPlaylist(msg);
    } else if (msg.type === 'reload') {
      location.reload();
    }
  }

  function connect() {
    try {
      ws = new WebSocket(wsUrl());
    } catch (e) {
      statusDot.style.display = 'block';
      setTimeout(connect, retryMs);
      return;
    }
    ws.onopen = function () {
      retryMs = 1000;
      statusDot.style.display = 'none';
      var sz = screenSize();
      lastReport = sz.width + 'x' + sz.height;
      ws.send(JSON.stringify({ type: 'hello', token: readToken(), width: sz.width, height: sz.height }));
    };
    ws.onmessage = onMessage;
    ws.onclose = function () {
      // Si se corta la conexión se sigue mostrando lo último y se reintenta.
      statusDot.style.display = 'block';
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 10000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  // Si el TV arranca sin red, se muestra lo último que se reprodujo (las imágenes y videos
  // salen de la caché del navegador si ya se vieron; si no, se omiten y se reintenta).
  var cached = readToken() ? loadLastPlay() : null;
  if (cached && cached.items && cached.items.length) { setPlaylist(cached); } else { showMessage('Conectando…', '', ''); }
  connect();

  /* Pantalla completa con un toque / OK del control (donde esté permitido). */
  document.addEventListener('click', function () {
    var d = document.documentElement;
    var fn = d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen;
    if (fn) { try { fn.call(d); } catch (e) {} }
  });
})();
</script>
</body>
</html>
