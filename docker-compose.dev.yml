# Solo Postgres y MinIO expuestos en localhost, para correr la app con `npm run dev`.
# Uso: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: carteleria
      POSTGRES_PASSWORD: carteleria
      POSTGRES_DB: carteleria
    ports: ["5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: carteleria
      MINIO_ROOT_PASSWORD: carteleria-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata-dev:/data]
volumes:
  pgdata-dev:
  miniodata-dev:
