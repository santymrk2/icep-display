name: carteleria
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carteleria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: carteleria
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteleria"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO dejó de publicar `minio/minio` en Docker Hub. Usamos la última build de la comunidad
    # (Bitnami, congelada en 2025.7.23). Es una imagen fija, sin actualizaciones de seguridad:
    # alcanza para una red local donde MinIO no se publica fuera de Docker. Ver README para migrar.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir en .env}
    volumes:
      - miniodata:/bitnami/minio/data
    # Sin puertos publicados: los archivos salen por la app (/files/*).
    # Para ver la consola de MinIO, descomentar:
    # ports: ["127.0.0.1:9001:9001"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 3000
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgres://carteleria:${POSTGRES_PASSWORD}@db:5432/carteleria
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: carteleria
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
